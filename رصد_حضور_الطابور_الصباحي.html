<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حضور الطابور الصباحي</title>
<style>
  :root{
    --bg:#F6F4EF;
    --surface:#FFFFFF;
    --ink:#1F2A24;
    --muted:#6B7A70;
    --line:#E4E0D6;
    --present:#2F6B4F;
    --present-bg:#E5F1E9;
    --absent:#A83B32;
    --absent-bg:#FBE9E6;
    --accent:#1F2A24;
    --radius:14px;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing:border-box;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Segoe UI","Tahoma",Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--bg);
  }
  header{
    padding:18px 18px 14px;
    background:var(--surface);
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    padding-top:calc(18px + env(safe-area-inset-top, 0px));
    z-index:5;
  }
  .school-name{
    font-size:15px;
    color:var(--muted);
    border:none;
    background:transparent;
    width:100%;
    padding:0;
    font-family:inherit;
    outline:none;
  }
  .date-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:8px;
  }
  .date-nav{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .date-btn{
    width:34px;height:34px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--surface);
    font-size:16px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    color:var(--ink);
  }
  .date-label{
    font-size:18px;
    font-weight:600;
  }
  .today-pill{
    font-size:12px;
    color:var(--present);
    background:var(--present-bg);
    border-radius:20px;
    padding:3px 10px;
    cursor:pointer;
    border:none;
  }
  .summary{
    display:flex;
    gap:10px;
    margin-top:14px;
  }
  .stat{
    flex:1;
    border-radius:var(--radius);
    padding:10px 12px;
    text-align:center;
  }
  .stat.present{background:var(--present-bg);color:var(--present);}
  .stat.absent{background:var(--absent-bg);color:var(--absent);}
  .stat .num{font-size:20px;font-weight:700;display:block;}
  .stat .lbl{font-size:12px;}

  main{flex:1;padding:14px 14px 100px;}

  .add-row{
    display:flex;
    gap:8px;
    margin-bottom:14px;
  }
  .add-row input{
    flex:1;
    padding:12px 14px;
    border-radius:var(--radius);
    border:1px solid var(--line);
    background:var(--surface);
    font-size:15px;
    font-family:inherit;
    outline:none;
  }
  .add-row button{
    width:46px;
    border-radius:var(--radius);
    border:none;
    background:var(--accent);
    color:#fff;
    font-size:20px;
    cursor:pointer;
  }

  .teacher{
    background:var(--surface);
    border-radius:var(--radius);
    padding:12px 12px;
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
    border:1px solid var(--line);
  }
  .teacher .name{
    flex:1;
    font-size:15px;
    font-weight:600;
  }
  .seg{
    display:flex;
    border-radius:20px;
    overflow:hidden;
    border:1px solid var(--line);
  }
  .seg button{
    border:none;
    background:var(--surface);
    padding:8px 14px;
    font-size:13px;
    font-family:inherit;
    color:var(--muted);
    cursor:pointer;
  }
  .seg button.on.present{background:var(--present);color:#fff;}
  .seg button.on.absent{background:var(--absent);color:#fff;}
  .remove-btn{
    width:26px;height:26px;
    border-radius:50%;
    border:none;
    background:transparent;
    color:var(--muted);
    font-size:16px;
    cursor:pointer;
  }

  .empty{
    text-align:center;
    color:var(--muted);
    padding:60px 20px;
    font-size:14px;
    line-height:1.8;
  }

  nav.tabs{
    position:sticky;
    bottom:0;
    background:var(--surface);
    border-top:1px solid var(--line);
    display:flex;
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  nav.tabs button{
    flex:1;
    padding:12px 0 10px;
    border:none;
    background:transparent;
    color:var(--muted);
    font-size:13px;
    font-family:inherit;
    cursor:pointer;
  }
  nav.tabs button.active{color:var(--ink);font-weight:700;}

  .report-item{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .report-item .name{font-weight:600;font-size:15px;}
  .report-item .bars{display:flex;gap:14px;font-size:13px;}
  .report-item .bars span.p{color:var(--present);}
  .report-item .bars span.a{color:var(--absent);}
  .export-btn{
    width:100%;
    padding:12px;
    border-radius:var(--radius);
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    font-size:14px;
    font-family:inherit;
    cursor:pointer;
    margin-bottom:14px;
  }
  .chart-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:14px;
  }
  .chart-card h3{
    margin:0 0 12px;
    font-size:14px;
    font-weight:700;
  }
  .bar-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }
  .bar-row .bar-name{
    width:92px;
    flex-shrink:0;
    font-size:12px;
    color:var(--muted);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .bar-track{
    flex:1;
    height:14px;
    background:var(--bg);
    border-radius:8px;
    overflow:hidden;
    position:relative;
  }
  .bar-fill{
    height:100%;
    border-radius:8px;
  }
  .bar-pct{
    width:38px;
    flex-shrink:0;
    font-size:12px;
    font-weight:700;
    text-align:left;
  }
  .trend-svg{width:100%;height:120px;display:block;}
  .chart-empty{font-size:12px;color:var(--muted);}
  .export-btn:last-of-type{margin-bottom:0;}
  .danger-btn{
    color:var(--absent);
    border-color:var(--absent-bg);
    margin-top:4px;
  }
  .hidden{display:none !important;}
  .print-only{display:none;}

  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{
      display:block;
      position:absolute;
      inset:0;
      padding:20px;
      direction:rtl;
    }
    #printArea h1{font-size:20px;margin:0 0 4px;}
    #printArea p{font-size:13px;color:#444;margin:0 0 16px;}
    #printArea table{width:100%;border-collapse:collapse;}
    #printArea th, #printArea td{
      border:1px solid #999;
      padding:8px 10px;
      text-align:right;
      font-size:13px;
    }
    #printArea th{background:#eee;}
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14181A;
      --surface:#1D2321;
      --ink:#EDEFEC;
      --muted:#8B978F;
      --line:#2B322F;
      --present-bg:#193226;
      --absent-bg:#331E1C;
    }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <input class="school-name" id="schoolName" placeholder="اسم المدرسة" value="مدرسة">
    <div class="date-row">
      <div class="date-nav">
        <button class="date-btn" id="prevDay">‹</button>
        <span class="date-label" id="dateLabel">—</span>
        <button class="date-btn" id="nextDay">›</button>
      </div>
      <button class="today-pill" id="todayBtn">اليوم</button>
    </div>
    <div class="summary">
      <div class="stat present"><span class="num" id="presentCount">0</span><span class="lbl">حاضر</span></div>
      <div class="stat absent"><span class="num" id="absentCount">0</span><span class="lbl">غائب</span></div>
    </div>
  </header>

  <main>
    <section id="todayView">
      <div class="add-row">
        <input id="newTeacher" placeholder="أضف اسم معلم جديد" maxlength="60">
        <button id="addTeacherBtn">+</button>
      </div>
      <button class="export-btn" id="importBtn">استيراد أسماء من ملف إكسل</button>
      <input type="file" id="importFile" accept=".xlsx,.xls,.csv" class="hidden">
      <div id="teacherList"></div>
      <div class="empty hidden" id="emptyState">لا يوجد معلمون بعد.<br>أضف أول اسم من الحقل أعلاه.</div>
    </section>

    <section id="reportView" class="hidden">
      <button class="export-btn" id="printBtn">طباعة / حفظ كـ PDF</button>
      <button class="export-btn" id="exportBtn">تصدير التقرير (CSV)</button>
      <div id="chartArea"></div>
      <div id="reportList"></div>
      <div class="empty hidden" id="reportEmpty">لا توجد بيانات كافية لعرض تقرير.</div>
      <button class="export-btn danger-btn" id="resetBtn">مسح جميع البيانات (المعلمون وسجل الحضور)</button>
    </section>
  </main>

  <div id="printArea" class="print-only">
    <h1 id="printSchool"></h1>
    <p id="printMeta"></p>
    <table id="printTable">
      <thead>
        <tr><th>اسم المعلم</th><th>أيام الحضور</th><th>أيام الغياب</th></tr>
      </thead>
      <tbody id="printTableBody"></tbody>
    </table>
  </div>

  <nav class="tabs">
    <button id="tabToday" class="active">اليوم</button>
    <button id="tabReport">التقرير</button>
  </nav>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
  const STORE_KEY = "morning-lineup-attendance-v1";
  const dayNames = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
  const monthNames = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];

  function loadState(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){ console.error("تعذر تحميل البيانات", e); }
    return { school:"مدرسة", teachers:[], attendance:{} };
  }
  function saveState(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
    catch(e){ console.error("تعذر حفظ البيانات", e); }
  }

  let state = loadState();
  let currentDate = new Date();
  currentDate.setHours(0,0,0,0);

  const schoolInput = document.getElementById("schoolName");
  schoolInput.value = state.school || "مدرسة";
  schoolInput.addEventListener("input", ()=>{ state.school = schoolInput.value; saveState(); });

  function fmtKey(d){
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function fmtLabel(d){
    return dayNames[d.getDay()]+"، "+d.getDate()+" "+monthNames[d.getMonth()]+" "+d.getFullYear();
  }
  function isSameDay(a,b){ return fmtKey(a)===fmtKey(b); }

  const dateLabel = document.getElementById("dateLabel");
  const teacherList = document.getElementById("teacherList");
  const emptyState = document.getElementById("emptyState");
  const presentCount = document.getElementById("presentCount");
  const absentCount = document.getElementById("absentCount");
  const todayBtn = document.getElementById("todayBtn");

  function getDayRecord(dateKey){
    if(!state.attendance[dateKey]) state.attendance[dateKey] = {};
    return state.attendance[dateKey];
  }

  function render(){
    dateLabel.textContent = fmtLabel(currentDate);
    const today = new Date(); today.setHours(0,0,0,0);
    todayBtn.style.visibility = isSameDay(currentDate, today) ? "hidden" : "visible";

    const dateKey = fmtKey(currentDate);
    const dayRecord = getDayRecord(dateKey);

    teacherList.innerHTML = "";
    if(state.teachers.length === 0){
      emptyState.classList.remove("hidden");
    } else {
      emptyState.classList.add("hidden");
    }

    let pCount = 0, aCount = 0;

    state.teachers.forEach(t=>{
      const status = dayRecord[t.id]; // "present" | "absent" | undefined
      if(status==="present") pCount++;
      if(status==="absent") aCount++;

      const row = document.createElement("div");
      row.className = "teacher";
      row.innerHTML = `
        <span class="name">${escapeHtml(t.name)}</span>
        <div class="seg">
          <button data-id="${t.id}" data-status="present" class="${status==='present'?'on present':''}">حاضر</button>
          <button data-id="${t.id}" data-status="absent" class="${status==='absent'?'on absent':''}">غائب</button>
        </div>
        <button class="remove-btn" data-edit="${t.id}" title="تعديل">✎</button>
        <button class="remove-btn" data-remove="${t.id}" title="حذف">✕</button>
      `;
      teacherList.appendChild(row);
    });

    presentCount.textContent = pCount;
    absentCount.textContent = aCount;
  }

  function escapeHtml(s){
    const d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  teacherList.addEventListener("click", (e)=>{
    const btn = e.target.closest("button");
    if(!btn) return;
    const dateKey = fmtKey(currentDate);
    const dayRecord = getDayRecord(dateKey);

    if(btn.dataset.id){
      const id = btn.dataset.id;
      const status = btn.dataset.status;
      if(dayRecord[id] === status){
        delete dayRecord[id];
      } else {
        dayRecord[id] = status;
      }
      saveState();
      render();
    } else if(btn.dataset.edit){
      const id = btn.dataset.edit;
      const teacher = state.teachers.find(t=>t.id===id);
      if(!teacher) return;
      const newName = prompt("تعديل اسم المعلم:", teacher.name);
      if(newName===null) return;
      const trimmed = newName.trim();
      if(!trimmed) return;
      teacher.name = trimmed;
      saveState();
      render();
      renderReport();
    } else if(btn.dataset.remove){
      const id = btn.dataset.remove;
      if(confirm("حذف هذا المعلم من القائمة؟ سيتم حذف سجل حضوره أيضًا.")){
        state.teachers = state.teachers.filter(t=>t.id!==id);
        Object.values(state.attendance).forEach(rec=>{ delete rec[id]; });
        saveState();
        render();
        renderReport();
      }
    }
  });

  document.getElementById("addTeacherBtn").addEventListener("click", addTeacher);
  document.getElementById("newTeacher").addEventListener("keydown", (e)=>{
    if(e.key === "Enter") addTeacher();
  });
  function addTeacher(){
    const input = document.getElementById("newTeacher");
    const name = input.value.trim();
    if(!name) return;
    state.teachers.push({ id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), name });
    input.value = "";
    saveState();
    render();
    renderReport();
  }

  document.getElementById("importBtn").addEventListener("click", ()=>{
    document.getElementById("importFile").click();
  });
  document.getElementById("importFile").addEventListener("change", (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (evt)=>{
      try{
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, {type:"array"});
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, {header:1});

        const existingNames = new Set(state.teachers.map(t=>t.name.trim()));
        let added = 0, skipped = 0;

        rows.forEach(row=>{
          if(!row || row.length===0) return;
          let val = row[0];
          if(val===undefined || val===null) return;
          const name = String(val).trim();
          if(!name) return;
          // تجاوز صف العنوان إن وجد
          if(name==="الاسم" || name.toLowerCase()==="name") return;
          if(existingNames.has(name)){ skipped++; return; }
          state.teachers.push({ id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), name });
          existingNames.add(name);
          added++;
        });

        saveState();
        render();
        renderReport();
        alert("تمت إضافة "+added+" اسمًا"+(skipped? " (تم تجاوز "+skipped+" اسمًا مكررًا)":"")+".");
      }catch(err){
        console.error(err);
        alert("تعذّر قراءة الملف. تأكد أن الأسماء موجودة في العمود الأول.");
      }
      e.target.value = "";
    };
    reader.readAsArrayBuffer(file);
  });

  document.getElementById("prevDay").addEventListener("click", ()=>{
    currentDate.setDate(currentDate.getDate()-1);
    render();
  });
  document.getElementById("nextDay").addEventListener("click", ()=>{
    currentDate.setDate(currentDate.getDate()+1);
    render();
  });
  todayBtn.addEventListener("click", ()=>{
    currentDate = new Date(); currentDate.setHours(0,0,0,0);
    render();
  });

  // Tabs
  const tabToday = document.getElementById("tabToday");
  const tabReport = document.getElementById("tabReport");
  const todayView = document.getElementById("todayView");
  const reportView = document.getElementById("reportView");

  tabToday.addEventListener("click", ()=>{
    tabToday.classList.add("active"); tabReport.classList.remove("active");
    todayView.classList.remove("hidden"); reportView.classList.add("hidden");
  });
  tabReport.addEventListener("click", ()=>{
    tabReport.classList.add("active"); tabToday.classList.remove("active");
    reportView.classList.remove("hidden"); todayView.classList.add("hidden");
    renderReport();
  });

  function computeTotals(){
    const totals = {};
    state.teachers.forEach(t=> totals[t.id] = {name:t.name, present:0, absent:0});
    Object.values(state.attendance).forEach(dayRec=>{
      Object.entries(dayRec).forEach(([id,status])=>{
        if(!totals[id]) return;
        if(status==="present") totals[id].present++;
        if(status==="absent") totals[id].absent++;
      });
    });
    return totals;
  }

  function renderReport(){
    const reportList = document.getElementById("reportList");
    const reportEmpty = document.getElementById("reportEmpty");
    reportList.innerHTML = "";

    if(state.teachers.length===0 || Object.keys(state.attendance).length===0){
      reportEmpty.classList.remove("hidden");
      document.getElementById("chartArea").innerHTML = "";
      return;
    }
    reportEmpty.classList.add("hidden");

    const totals = computeTotals();

    Object.values(totals).forEach(t=>{
      const item = document.createElement("div");
      item.className = "report-item";
      item.innerHTML = `
        <span class="name">${escapeHtml(t.name)}</span>
        <div class="bars"><span class="p">حاضر ${t.present}</span><span class="a">غائب ${t.absent}</span></div>
      `;
      reportList.appendChild(item);
    });

    renderCharts(totals);
  }

  function renderCharts(totals){
    const chartArea = document.getElementById("chartArea");
    chartArea.innerHTML = "";

    // بطاقة: نسبة الالتزام بالحضور لكل معلم
    const rateCard = document.createElement("div");
    rateCard.className = "chart-card";
    let rateHtml = "<h3>نسبة الالتزام بالحضور</h3>";
    const teachersWithData = Object.values(totals).filter(t=> (t.present+t.absent) > 0);
    if(teachersWithData.length===0){
      rateHtml += `<div class="chart-empty">لا توجد سجلات حضور بعد.</div>`;
    } else {
      teachersWithData
        .sort((a,b)=> (b.present/(b.present+b.absent)) - (a.present/(a.present+a.absent)))
        .forEach(t=>{
          const total = t.present + t.absent;
          const pct = Math.round((t.present/total)*100);
          const color = pct>=90 ? "var(--present)" : (pct>=75 ? "#C98A2C" : "var(--absent)");
          rateHtml += `
            <div class="bar-row">
              <span class="bar-name">${escapeHtml(t.name)}</span>
              <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color};"></div></div>
              <span class="bar-pct">${pct}%</span>
            </div>`;
        });
    }
    rateCard.innerHTML = rateHtml;
    chartArea.appendChild(rateCard);

    // بطاقة: اتجاه نسبة الحضور اليومية خلال آخر الأيام المسجلة
    const trendCard = document.createElement("div");
    trendCard.className = "chart-card";
    const dateKeys = Object.keys(state.attendance)
      .filter(k=> Object.keys(state.attendance[k]).length>0)
      .sort()
      .slice(-14);

    let trendHtml = "<h3>اتجاه نسبة الحضور اليومية (آخر الأيام المسجلة)</h3>";
    if(dateKeys.length < 2){
      trendHtml += `<div class="chart-empty">سجّل الحضور لأكثر من يوم لعرض الاتجاه.</div>`;
      trendCard.innerHTML = trendHtml;
      chartArea.appendChild(trendCard);
    } else {
      const rates = dateKeys.map(k=>{
        const rec = state.attendance[k];
        const vals = Object.values(rec);
        const p = vals.filter(v=>v==="present").length;
        const total = vals.length;
        return total>0 ? Math.round((p/total)*100) : 0;
      });

      const w = 320, h = 100, pad = 8;
      const stepX = (w - pad*2) / (rates.length - 1);
      const points = rates.map((r,i)=>{
        const x = pad + i*stepX;
        const y = pad + (100 - r) * (h - pad*2) / 100;
        return x+","+y;
      }).join(" ");

      const lastX = pad + (rates.length-1)*stepX;
      const svg = `
        <svg class="trend-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
          <polyline points="${points}" fill="none" stroke="var(--present)" stroke-width="2" vector-effect="non-scaling-stroke"/>
          ${rates.map((r,i)=>{
            const x = pad + i*stepX;
            const y = pad + (100 - r) * (h - pad*2) / 100;
            return `<circle cx="${x}" cy="${y}" r="2.5" fill="var(--present)"/>`;
          }).join("")}
        </svg>`;
      trendHtml += svg;
      trendHtml += `<div class="chart-empty" style="margin-top:6px;">من ${rates[0]}% إلى ${rates[rates.length-1]}%</div>`;
      trendCard.innerHTML = trendHtml;
      chartArea.appendChild(trendCard);
    }
  }

  document.getElementById("printBtn").addEventListener("click", ()=>{
    const totals = computeTotals();

    document.getElementById("printSchool").textContent = state.school || "مدرسة";
    const now = new Date();
    document.getElementById("printMeta").textContent = "تقرير حضور الطابور الصباحي — تاريخ الطباعة: "+fmtLabel(now);

    const tbody = document.getElementById("printTableBody");
    tbody.innerHTML = "";
    Object.values(totals).forEach(t=>{
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${escapeHtml(t.name)}</td><td>${t.present}</td><td>${t.absent}</td>`;
      tbody.appendChild(tr);
    });

    window.print();
  });

  document.getElementById("exportBtn").addEventListener("click", ()=>{
    let csv = "الاسم,أيام الحضور,أيام الغياب\n";
    const totals = computeTotals();
    Object.values(totals).forEach(t=>{
      csv += `"${t.name}",${t.present},${t.absent}\n`;
    });
    const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "تقرير_حضور_الطابور.csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  render();
})();
</script>
</body>
</html>
